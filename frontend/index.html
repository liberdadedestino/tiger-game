<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fortune Tiger - Official Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <div class="casino-bg">
    <div class="light-ray left"></div>
    <div class="light-ray right"></div>
  </div>

  <div class="game-container">
    <!-- Top Navigation -->
    <header class="top-nav">
      <div class="user-badge" onclick="abrirModal('modal-auth')">
        <span class="user-icon">👤</span>
        <span id="user-display-name">Entrar</span>
      </div>
      <div class="nav-actions">
        <button id="btn-sound" class="sound-toggle" onclick="toggleAudio()">🔊</button>
        <button class="nav-btn deposit" onclick="abrirModal('modal-deposit')">+ DEPOSITAR</button>
        <button class="nav-btn withdraw" onclick="abrirModal('modal-withdraw')">SAQUE</button>
      </div>
    </header>

    <!-- Templo Oriental com Mascote -->
    <div class="pagoda-stage">
      <div class="pagoda-roof">
        <div class="roof-tiles"></div>
      </div>
      
      <div class="mascot-stage">
        <div class="tiger-mascot-hd">
          <svg class="tiger-render" viewBox="0 0 160 160">
            <defs>
              <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#ffcc00"/>
                <stop offset="70%" stop-color="#ff6600"/>
                <stop offset="100%" stop-color="#cc2200"/>
              </radialGradient>
              <linearGradient id="goldCap" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#fff7b3"/>
                <stop offset="50%" stop-color="#ffd700"/>
                <stop offset="100%" stop-color="#b8860b"/>
              </linearGradient>
            </defs>
            <path d="M 32 36 Q 20 10 44 18 Z" fill="url(#bodyGrad)" stroke="#441100" stroke-width="2.5"/>
            <path d="M 34 32 Q 26 16 40 22 Z" fill="#ff9999"/>
            <path d="M 128 36 Q 140 10 116 18 Z" fill="url(#bodyGrad)" stroke="#441100" stroke-width="2.5"/>
            <path d="M 126 32 Q 134 16 120 22 Z" fill="#ff9999"/>
            <ellipse cx="80" cy="80" rx="54" ry="46" fill="url(#bodyGrad)" stroke="#3a0900" stroke-width="3"/>
            <path d="M 80 34 L 80 48 M 68 38 L 74 48 M 92 38 L 86 48" stroke="#220500" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="58" cy="95" rx="18" ry="14" fill="#fff9e6"/>
            <ellipse cx="102" cy="95" rx="18" ry="14" fill="#fff9e6"/>
            <polygon points="74,86 86,86 80,94" fill="#ff4466"/>
            <path d="M 36 56 Q 56 50 78 56 Q 78 76 56 76 Q 36 76 36 56 Z" fill="#151515" stroke="url(#goldCap)" stroke-width="3.5"/>
            <path d="M 82 56 Q 104 50 124 56 Q 124 76 104 76 Q 82 76 82 56 Z" fill="#151515" stroke="url(#goldCap)" stroke-width="3.5"/>
            <line x1="78" y1="62" x2="82" y2="62" stroke="url(#goldCap)" stroke-width="4"/>
            <path d="M 58 98 Q 80 122 102 98 C 96 116 64 116 58 98 Z" fill="#660000" stroke="#330000" stroke-width="2"/>
            <path d="M 72 98 L 76 105 L 80 98 Z" fill="#ffffff"/>
            <path d="M 40 120 Q 80 108 120 120 L 130 155 Q 80 165 30 155 Z" fill="#dd0000" stroke="url(#goldCap)" stroke-width="3"/>
          </svg>
        </div>
        <div class="tiger-banner-tag">WILD 10X</div>
      </div>
    </div>

    <!-- Moldura dos Rolos 3x3 (Sem os números nas laterais) -->
    <main class="slot-machine">
      <div class="pg-frame">
        <div class="grid-3x3">
          <div class="cell" id="c00"></div>
          <div class="cell" id="c01"></div>
          <div class="cell" id="c02"></div>
          <div class="cell" id="c10"></div>
          <div class="cell" id="c11"></div>
          <div class="cell" id="c12"></div>
          <div class="cell" id="c20"></div>
          <div class="cell" id="c21"></div>
          <div class="cell" id="c22"></div>
        </div>
      </div>
    </main>

    <!-- Banner Central de Notificação -->
    <div class="fortune-banner">
      <span id="banner-text">Sorte do Tigre! Faça sua aposta e gire!</span>
    </div>

    <!-- Painel de Rodapé e Giro -->
    <footer class="footer-panel">
      <div class="stats-ribbon">
        <div class="stat-box">
          <span class="stat-label">SALDO</span>
          <span class="stat-value" id="saldo">R$ 0,00</span>
        </div>
        <div class="stat-box highlight">
          <span class="stat-label">APOSTA</span>
          <span class="stat-value" id="aposta-display">R$ 1,00</span>
        </div>
        <div class="stat-box win">
          <span class="stat-label">GANHO</span>
          <span class="stat-value" id="win-display">R$ 0,00</span>
        </div>
      </div>

      <div class="pg-controls">
        <button class="btn-step" onclick="alterarAposta(-1.00)">-</button>
        <button id="btn-spin" class="btn-spin-circular" onclick="girar()">
          <div class="spin-inner">
            <span class="spin-icon">⚡</span>
            <span class="spin-text">GIRAR</span>
          </div>
        </button>
        <button class="btn-step" onclick="alterarAposta(1.00)">+</button>
      </div>
    </footer>
  </div>

  <!-- Modal Login Social -->
  <div class="modal-overlay" id="modal-auth">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modal-auth')">✕</button>
      <h2>ENTRAR / CADASTRAR</h2>
      <p class="auth-sub">Conecte sua conta para vincular seu saldo de jogo</p>

      <button class="btn-social google" onclick="loginSocial('Google')">
        <span class="social-icon">🌐</span> Continuar com Google
      </button>
      <button class="btn-social instagram" onclick="loginSocial('Instagram')">
        <span class="social-icon">📸</span> Continuar com Instagram
      </button>
      <button class="btn-social facebook" onclick="loginSocial('Facebook')">
        <span class="social-icon">📘</span> Continuar com Facebook
      </button>
    </div>
  </div>

  <!-- Modal Depósito PIX -->
  <div class="modal-overlay" id="modal-deposit">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modal-deposit')">✕</button>
      <h2>DEPÓSITO PIX INSTANTÂNEO</h2>
      <div class="input-group">
        <label>Valor do Depósito (Mínimo R$ 5,00)</label>
        <input type="number" id="dep-val" value="5.00" min="5" step="5">
      </div>
      <button class="btn-action" onclick="gerarPix()">GERAR PIX</button>
      
      <div id="pix-result" class="pix-result hidden">
        <img id="qr-img" src="" alt="QR Code PIX">
        <input type="text" id="pix-code" readonly>
        <button class="btn-action secondary" onclick="copiarPix()">COPIAR CHAVE PIX</button>
        <div class="pix-status-loader">
          <div class="spinner"></div>
          <span id="pix-status-txt">Aguardando pagamento no app do banco...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Saque -->
  <div class="modal-overlay" id="modal-withdraw">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modal-withdraw')">✕</button>
      <h2>SOLICITAR SAQUE</h2>
      <div class="input-group">
        <label>Valor do Saque (R$)</label>
        <input type="number" id="saque-val" value="10.00" min="10">
      </div>
      <div class="input-group">
        <label>Chave PIX (CPF / Telefone / E-mail)</label>
        <input type="text" id="saque-chave" placeholder="Sua chave PIX">
      </div>
      <button class="btn-action" onclick="solicitarSaque()">CONFIRMAR SAQUE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
