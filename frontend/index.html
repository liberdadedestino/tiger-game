<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fortune Tiger - PG Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="casino-bg"></div>

  <div class="game-container">
    <!-- Topo: Menu de usuário e depósitos -->
    <header class="top-nav">
      <div class="user-badge" onclick="abrirModal('modal-auth')">
        <span class="user-icon">👤</span>
        <span id="user-display-name">Entrar</span>
      </div>
      <div class="nav-actions">
        <button class="nav-btn deposit" onclick="abrirModal('modal-deposit')">+ DEPOSITAR</button>
        <button class="nav-btn withdraw" onclick="abrirModal('modal-withdraw')">SAQUE</button>
      </div>
    </header>

    <!-- Estrutura do Templo com o Mascote no Topo -->
    <div class="pagoda-header">
      <div class="pagoda-roof">
        <div class="roof-tiles"></div>
      </div>
      <div class="mascot-stage">
        <div class="tiger-character">
          <div class="tiger-face">🐯</div>
          <div class="tiger-tag">WILD 10X</div>
        </div>
      </div>
    </div>

    <!-- Moldura Principal do Jogo 3x3 -->
    <main class="slot-machine">
      <div class="pg-frame">
        <div class="pillar left">
          <span class="line-num">1</span>
          <span class="line-num">2</span>
          <span class="line-num">3</span>
        </div>

        <div class="grid-3x3">
          <div class="cell" id="c00"><div class="symbol-wrapper">🐯</div></div>
          <div class="cell" id="c01"><div class="symbol-wrapper">🏺</div></div>
          <div class="cell" id="c02"><div class="symbol-wrapper">🟢</div></div>
          <div class="cell" id="c10"><div class="symbol-wrapper">🧧</div></div>
          <div class="cell" id="c11"><div class="symbol-wrapper">🐯</div></div>
          <div class="cell" id="c12"><div class="symbol-wrapper">🪙</div></div>
          <div class="cell" id="c20"><div class="symbol-wrapper">💎</div></div>
          <div class="cell" id="c21"><div class="symbol-wrapper">🧧</div></div>
          <div class="cell" id="c22"><div class="symbol-wrapper">🎰</div></div>
        </div>

        <div class="pillar right">
          <span class="line-num">4</span>
          <span class="line-num">5</span>
        </div>
      </div>
    </main>

    <!-- Banner Central de Mensagens do Tigre -->
    <div class="fortune-banner">
      <span id="banner-text">Sorte do Tigre! Faça sua jogada!</span>
    </div>

    <!-- Rodapé: Carteira, Aposta e Botão de Giro Circular -->
    <footer class="footer-panel">
      <div class="stats-ribbon">
        <div class="stat-box">
          <span class="stat-label">SALDO</span>
          <span class="stat-value" id="saldo">R$ 0,00</span>
        </div>
        <div class="stat-box highlight">
          <span class="stat-label">APOSTA</span>
          <span class="stat-value" id="aposta-display">R$ 1,00</span>
        </div>
        <div class="stat-box win">
          <span class="stat-label">GANHO</span>
          <span class="stat-value" id="win-display">R$ 0,00</span>
        </div>
      </div>

      <div class="pg-controls">
        <button class="btn-step" onclick="alterarAposta(-1.00)">-</button>
        <button id="btn-spin" class="btn-spin-circular" onclick="girar()">
          <div class="spin-inner">
            <span class="spin-icon">⚡</span>
            <span class="spin-text">GIRAR</span>
          </div>
        </button>
        <button class="btn-step" onclick="alterarAposta(1.00)">+</button>
      </div>
    </footer>
  </div>

  <!-- Modal Login Social (Google, Instagram, Facebook) -->
  <div class="modal-overlay" id="modal-auth">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modal-auth')">✕</button>
      <h2>ENTRAR / CADASTRAR</h2>
      <p class="auth-sub">Conecte sua conta social para vincular seu saldo de jogo</p>

      <button class="btn-social google" onclick="loginSocial('Google')">
        <span class="social-icon">🌐</span> Continuar com Google
      </button>

      <button class="btn-social instagram" onclick="loginSocial('Instagram')">
        <span class="social-icon">📸</span> Continuar com Instagram
      </button>

      <button class="btn-social facebook" onclick="loginSocial('Facebook')">
        <span class="social-icon">📘</span> Continuar com Facebook
      </button>
    </div>
  </div>

  <!-- Modal Depósito PIX -->
  <div class="modal-overlay" id="modal-deposit">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modal-deposit')">✕</button>
      <h2>DEPÓSITO PIX INSTANTÂNEO</h2>
      <div class="input-group">
        <label>Valor do Depósito (Mínimo R$ 5,00)</label>
        <input type="number" id="dep-val" value="5.00" min="5" step="5">
      </div>
      <button class="btn-action" onclick="gerarPix()">GERAR PIX</button>
      
      <div id="pix-result" class="pix-result hidden">
        <img id="qr-img" src="" alt="QR Code PIX">
        <input type="text" id="pix-code" readonly>
        <button class="btn-action secondary" onclick="copiarPix()">COPIAR CHAVE PIX</button>
        <div class="pix-status-loader">
          <div class="spinner"></div>
          <span id="pix-status-txt">Aguardando pagamento no aplicativo do banco...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Saque -->
  <div class="modal-overlay" id="modal-withdraw">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modal-withdraw')">✕</button>
      <h2>SOLICITAR SAQUE</h2>
      <div class="input-group">
        <label>Valor do Saque (R$)</label>
        <input type="number" id="saque-val" value="10.00" min="10">
      </div>
      <div class="input-group">
        <label>Chave PIX (CPF / Telefone / E-mail)</label>
        <input type="text" id="saque-chave" placeholder="Sua chave PIX">
      </div>
      <button class="btn-action" onclick="solicitarSaque()">CONFIRMAR SAQUE</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
