<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Tiger Classic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="header">
      <h1>FORTUNE TIGER</h1>
      <div class="balance-box">
        <span>SALDO: R$ <strong id="saldo">100.00</strong></span>
      </div>
    </header>

    <main class="slot-machine">
      <div class="reel-container">
        <div class="reel" id="reel1">🐯</div>
        <div class="reel" id="reel2">🐯</div>
        <div class="reel" id="reel3">🐯</div>
      </div>
    </main>

    <footer class="controls">
      <div class="bet-control">
        <label>Aposta: R$</label>
        <input type="number" id="aposta" value="1.00" min="0.50" step="0.50">
      </div>
      <button id="btn-spin" onclick="girar()">GIRAR</button>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
